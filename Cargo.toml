[package]
name = "memtop"
version = "0.1.0"
edition = "2024"
description = "A Linux CLI that lists processes by memory usage, with app grouping, JSON/watch modes, and an interactive kill TUI."
license = "MIT"
repository = "https://github.com/Arshdeep54/memtop"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
serde_json = "1.0.151"
